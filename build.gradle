plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
loom {
    splitEnvironmentSourceSets()
    mods {
        shulkerboxes_reloaded {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    if (!project.hasProperty('withoutCloth')) {
        clientRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
            exclude group: 'net.fabricmc.fabric-api'
        }
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'shulkerboxes_reloaded-test'
        enableGameTests = true
        enableClientGameTests = project.hasProperty('clientTests')
        eula = true
    }
}
if (project.hasProperty('clientTests')) {
    sourceSets.gametest.java.srcDir('src/clientTest/java')
    sourceSets.gametest.compileClasspath += sourceSets.client.output
    sourceSets.gametest.compileClasspath += sourceSets.client.compileClasspath
    sourceSets.gametest.runtimeClasspath += sourceSets.client.output
    sourceSets.gametest.runtimeClasspath += sourceSets.client.runtimeClasspath
}
tasks.named('processGametestResources') {
    inputs.property('clientTests', project.hasProperty('clientTests'))
    inputs.property('withoutCloth', project.hasProperty('withoutCloth'))
    if (project.hasProperty('clientTests')) {
        doLast {
            def metadataFile = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
            metadata.entrypoints['fabric-client-gametest'] = [project.hasProperty('withoutCloth')
                    ? 'net.shulkerboxes_reloaded.MissingClothClientTest' : 'net.shulkerboxes_reloaded.ConfigMenuClientTest']
            metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
        }
    }
}
jar { from('LICENSE') { rename { "LICENSE_${project.archives_base_name}" } } }

tasks.register('sourceZip', Zip) {
    archiveFileName = "${project.archives_base_name}-${project.version}-github-source.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    // Gradle's default Ant excludes filter .gitignore even as an explicit file.
    from({ resources.text.fromString(file('.gitignore').getText('UTF-8')).asFile() }) {
        rename { '.gitignore' }
    }
    from(files('ARTWORK.md', 'build.gradle', 'CHANGELOG.md', 'gradle.properties',
            'gradlew', 'gradlew.bat', 'LICENSE', 'README.md', 'REVIEW.md', 'settings.gradle', 'VALIDATION.md'))
    from('src') { into 'src' }
    from('gradle') { into 'gradle' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
